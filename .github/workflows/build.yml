name: Build aplikasi

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------------------
  # Unit test di setiap OS & kombinasi pustaka yang dikirim ke pengguna
  # ---------------------------------------------------------------------------
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  py: "3.12", req: requirements-dev.txt,        label: Linux }
          - { os: windows-latest, py: "3.12", req: requirements-dev.txt,        label: Windows-10-11 }
          - { os: macos-15,       py: "3.12", req: requirements-dev.txt,        label: macOS-AppleSilicon }
          - { os: macos-15-intel, py: "3.12", req: requirements-dev.txt,        label: macOS-Intel }
          - { os: windows-latest, py: "3.8",  req: requirements-legacy-dev.txt, label: Windows-7-8-legacy }
          - { os: windows-latest, py: "3.8",  req: requirements-legacy-dev.txt, label: Windows-32bit-legacy, arch: x86 }
          - { os: macos-15-intel, py: "3.8",  req: requirements-legacy-dev.txt, label: macOS-lama-legacy }
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.py }}", architecture: "${{ matrix.arch || 'x64' }}" }
      - name: Pustaka sistem untuk Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r ${{ matrix.req }}
      - name: Unit test
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Benchmark akurasi (LJK sintetis)
        if: matrix.label == 'Linux'
        run: |
          python tests/make_synthetic.py tests/data
          python tests/bench_accuracy.py
          python tests/bench_stress.py

  # ---------------------------------------------------------------------------
  # Build aplikasi siap pakai
  # ---------------------------------------------------------------------------
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS memakai Python resmi python.org (bukan Python bawaan runner) supaya versi macOS minimum tetap rendah
          - { os: windows-latest, py: "3.12", req: requirements.txt,        pyi: "pyinstaller>=6.6",    mupdf: pymupdf, label: Windows-10-11 }
          - { os: macos-15,       pyorg: "3.12.8/python-3.12.8-macos11.pkg", req: requirements.txt, pyi: "pyinstaller>=6.6", mupdf: pymupdf, label: macOS-AppleSilicon }
          - { os: macos-15-intel, pyorg: "3.12.8/python-3.12.8-macos11.pkg", req: requirements.txt, pyi: "pyinstaller>=6.6", mupdf: pymupdf, label: macOS-Intel }
          - { os: windows-latest, py: "3.8",  req: requirements-legacy.txt, pyi: "pyinstaller==5.13.2", mupdf: fitz,    label: Windows-7-8-8.1 }
          - { os: windows-latest, py: "3.8",  req: requirements-legacy.txt, pyi: "pyinstaller==5.13.2", mupdf: fitz,    label: Windows-32bit, arch: x86 }
          - { os: macos-15-intel, pyorg: "3.8.10/python-3.8.10-macosx10.9.pkg", req: requirements-legacy.txt, pyi: "pyinstaller==5.13.2", mupdf: fitz, label: macOS-Intel-lama }
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.py
        with: { python-version: "${{ matrix.py }}", architecture: "${{ matrix.arch || 'x64' }}" }
      - name: Python resmi python.org (macOS)
        if: matrix.pyorg
        run: |
          curl -sSLo /tmp/python.pkg "https://www.python.org/ftp/python/${{ matrix.pyorg }}"
          sudo installer -pkg /tmp/python.pkg -target /
          V=$(echo "${{ matrix.pyorg }}" | cut -d/ -f1 | cut -d. -f1-2)
          /Library/Frameworks/Python.framework/Versions/$V/bin/python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ${{ matrix.req }} "${{ matrix.pyi }}"
      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name "Koreksi LJK"
          --collect-submodules ${{ matrix.mupdf }}
          --exclude-module onnxruntime --exclude-module PIL --exclude-module tkinter --exclude-module pytest
          --osx-bundle-identifier id.lanaaqil.koreksiljk
          run.py
      - name: Versi macOS minimum + tanda tangan ad-hoc
        if: runner.os == 'macOS'
        run: |
          python tools/macos_min_version.py "dist/Koreksi LJK.app" --set-plist
          codesign --force --deep --sign - "dist/Koreksi LJK.app"
          codesign --verify --deep --strict "dist/Koreksi LJK.app"
      - name: Uji jalan aplikasi hasil build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Koreksi LJK/Koreksi LJK.exe" -ArgumentList "--selftest","$env:RUNNER_TEMP\selftest.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\selftest.txt" -Pattern "SELFTEST OK")) { exit 1 }
      - name: Uji jalan aplikasi hasil build (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Koreksi LJK.app/Contents/MacOS/Koreksi LJK" --selftest "$RUNNER_TEMP/selftest.txt"
          cat "$RUNNER_TEMP/selftest.txt"; grep -q "SELFTEST OK" "$RUNNER_TEMP/selftest.txt"
      - name: Kemas (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Koreksi LJK" -DestinationPath "Koreksi-LJK-${{ matrix.label }}.zip"
      - name: Kemas (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Koreksi LJK.app" "Koreksi-LJK-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Koreksi-LJK-${{ matrix.label }}
          path: Koreksi-LJK-${{ matrix.label }}.zip
      - name: Lampirkan ke Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Koreksi-LJK-${{ matrix.label }}.zip
